{% load i18n %}

<div class="card mb-3">
    <div class="card-header">{% trans 'Digital object identifier' %}</div>
    <div class="card-body">
        <p>
            {% blocktrans %}
            Use the DOI link below when citing this {{ dataset }} in a publication:
            {% endblocktrans %}
        </p>
        <p>
            <a class="text-break" href="{{ doi_url }}">{{ doi_url }}</a>
        </p>
    </div>
</div>
